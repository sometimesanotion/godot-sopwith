<svg viewBox="0 0 200 140" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- ground -->
  <rect x="10" y="128" width="180" height="6" fill="#c9bfa0"/>
  <!-- lower brick wall -->
  <rect x="30" y="95" width="140" height="35" fill="#a5764f" stroke="#000" stroke-width="4"/>
  <!-- upper wood wall -->
  <rect x="30" y="55" width="140" height="40" fill="#8b9560" stroke="#000" stroke-width="4"/>
  <!-- vertical siding lines -->
  <g stroke="#000" stroke-width="1" opacity="0.5">
    <line x1="45" y1="55" x2="45" y2="95"/><line x1="60" y1="55" x2="60" y2="95"/>
    <line x1="140" y1="55" x2="140" y2="95"/><line x1="155" y1="55" x2="155" y2="95"/>
  </g>
  <!-- roof -->
  <path d="M20 55 L100 25 L180 55 Z" fill="#6f7749" stroke="#000" stroke-width="4" stroke-linejoin="round"/>
  <!-- roof lamp -->
  <line x1="100" y1="25" x2="100" y2="14" stroke="#333" stroke-width="2"/>
  <path d="M94 14 L106 14 L102 20 L98 20 Z" fill="#222" stroke="#000" stroke-width="1.5"/>
  <!-- sign board with shell icon -->
  <rect x="75" y="60" width="50" height="16" fill="#e8e0cc" stroke="#000" stroke-width="2.5"/>
  <ellipse cx="100" cy="68" rx="16" ry="5" fill="#2b2f22"/>
  <path d="M85 68 L92 64 L92 72 Z" fill="#2b2f22"/>
  <!-- double doors -->
  <rect x="75" y="85" width="50" height="45" fill="#4a5233" stroke="#000" stroke-width="3.5"/>
  <line x1="100" y1="85" x2="100" y2="130" stroke="#000" stroke-width="2.5"/>
  <path d="M75 85 L100 107 M125 85 L100 107 M75 130 L100 108 M125 130 L100 108" stroke="#000" stroke-width="1.5" fill="none"/>
  <!-- crate stacks left -->
  <g stroke="#000" stroke-width="2">
    <rect x="35" y="105" width="18" height="18" fill="#a5763f"/>
    <path d="M35 105 L53 123 M53 105 L35 123" stroke="#000" stroke-width="1"/>
    <rect x="35" y="87" width="18" height="18" fill="#a5763f"/>
    <path d="M35 87 L53 105 M53 87 L35 105" stroke="#000" stroke-width="1"/>
  </g>
  <!-- shells left -->
  <g fill="#5c6b3a" stroke="#000" stroke-width="1.5">
    <rect x="26" y="95" width="7" height="35" rx="2"/>
    <path d="M26 95 Q29.5 88 33 95 Z"/>
    <rect x="14" y="100" width="7" height="30" rx="2"/>
    <path d="M14 100 Q17.5 93 21 100 Z"/>
  </g>
  <!-- crate stacks right -->
  <g stroke="#000" stroke-width="2">
    <rect x="147" y="105" width="18" height="18" fill="#a5763f"/>
    <path d="M147 105 L165 123 M165 105 L147 123" stroke="#000" stroke-width="1"/>
    <rect x="147" y="87" width="18" height="18" fill="#a5763f"/>
    <path d="M147 87 L165 105 M165 87 L147 105" stroke="#000" stroke-width="1"/>
  </g>
  <!-- shells right -->
  <g fill="#5c6b3a" stroke="#000" stroke-width="1.5">
    <rect x="167" y="95" width="7" height="35" rx="2"/>
    <path d="M167 95 Q170.5 88 174 95 Z"/>
    <rect x="179" y="100" width="7" height="30" rx="2"/>
    <path d="M179 100 Q182.5 93 186 100 Z"/>
  </g>
</svg>
